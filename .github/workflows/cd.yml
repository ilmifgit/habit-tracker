name: CD

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build fat-jar
        run: |
          chmod +x gradlew
          ./gradlew buildFatJar -x test --no-daemon

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}

      - name: Copy jar to VPS
        run: |
          scp build/libs/ktfinal-all.jar "$PROD_USER@$PROD_HOST:/root/ktfinal-deploy/build/libs/ktfinal-all.jar"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}

      - name: Restart container
        run: |
          ssh "$PROD_USER@$PROD_HOST" "cd /root/ktfinal-deploy && docker compose -f docker-compose.prod.yml down && docker compose -f docker-compose.prod.yml up -d --build && sleep 15 && curl -f http://localhost:8080/swagger/openapi.json > /dev/null && echo 'Deploy OK'"
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}